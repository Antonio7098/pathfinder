<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pathfinder Graph Viewer</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <h1>Pathfinder Viewer</h1>
        <p class="muted">Minimal structural graph viewer for Pathfinder artifacts.</p>

        <section class="panel controls">
          <h2>Load graph</h2>
          <button id="load-server-graph" type="button">Load server graph</button>
          <label class="file-input">
            <span>Open JSON file</span>
            <input id="graph-file" type="file" accept="application/json">
          </label>
          <p id="status" class="status">No graph loaded yet.</p>
        </section>

        <section class="panel controls">
          <h2>Filters</h2>
          <input id="search" type="search" placeholder="Search file path...">
          <select id="language-filter">
            <option value="all">All languages</option>
          </select>
          <select id="relation-filter">
            <option value="all">All relationships</option>
          </select>
          <label class="toggle-row" for="trim-isolated">
            <input id="trim-isolated" type="checkbox" checked>
            <span>Hide disconnected files by default</span>
          </label>
          <p id="view-meta" class="status">No graph rendered yet.</p>
        </section>

        <section class="panel">
          <h2>Summary</h2>
          <dl id="summary" class="summary-list"></dl>
        </section>

        <section class="panel">
          <h2>Selection</h2>
          <div id="selection" class="selection-empty">Click a node to inspect it.</div>
        </section>
      </aside>

      <main class="main-panel">
        <div class="legend-bar" id="legend"></div>
        <canvas id="graph-canvas"></canvas>
      </main>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
